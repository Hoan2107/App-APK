name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tao khung Android
        run: |
          flutter create --platforms=android --org vn.smsbulk --project-name sms_bulk /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android ./android

      - name: Va quyen, dich vu gui nen, icon
        run: python3 tools/patch_android.py

      - name: Lay thu vien
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: sms-bulk-apk
          path: build/app/outputs/flutter-apk/app-release.apk
