name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tạo khung Android
        run: |
          flutter create --platforms=android --org vn.smsbulk --project-name sms_bulk /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Gắn quyền và code gửi SMS
        run: python3 tools/patch_android.py

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: sms-bulk-apk
          path: build/app/outputs/flutter-apk/app-release.apk
